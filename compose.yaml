services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: windops
      POSTGRES_PASSWORD: windops_local_only
      POSTGRES_DB: windops
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windops -d windops"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://windops:windops_local_only@db:5432/windops
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
