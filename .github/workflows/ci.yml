name: API - build and tests
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windops_test
          POSTGRES_PASSWORD: windops_test_local_only
          POSTGRES_DB: windops_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U windops_test -d windops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (npm ci once lockfile is committed)
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        run: npm test -- --coverage
      - name: PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://windops_test:windops_test_local_only@127.0.0.1:5435/windops_test
          NODE_ENV: test
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Validate Docker image build
        run: docker build -t windops-api:ci .
