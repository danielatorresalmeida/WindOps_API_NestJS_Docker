# Dedicated test-only database. Do not combine with the development Compose stack.
name: windops-integration-tests
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: windops_test
      POSTGRES_PASSWORD: windops_test_local_only
      POSTGRES_DB: windops_test
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - integration_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windops_test -d windops_test"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  integration_postgres_data:
